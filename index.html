<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Toggle BG & Light Edition</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 10px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 8px;
      border-radius: 15px;
      font-size: 9.5px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      white-space: nowrap;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.85);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 14px; background: rgba(228,195,139,0.3); margin: 0 1px;"></div>
    <button class="control-btn" id="bg-btn" onclick="toggleBackground()">BG: ON</button>
    <div style="width: 1px; height: 14px; background: rgba(228,195,139,0.3); margin: 0 1px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    LUXURY PRO: <span id="status">INITIALIZING...</span> | 軽量・背景切替対応
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];
    let isDetecting = false;
    let frameCounter = 0;

    let bgEnabled = true; // 背景（夜景AR）のON/OFF状態

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識の軽量化（間引き検知） ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
    }

    async function triggerFaceDetect() {
      if (isDetecting || webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) return;
      isDetecting = true;
      try {
        const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }));
        const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
        faces = faceapi.resizeResults(detections, displaySize);
      } catch (e) {
        console.error(e);
      }
      isDetecting = false;
    }

    // --- ピンチズーム操作 ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          applyZoom(zoomStartValue * distanceRatio);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
    });

    // --- Canvasリサイズ ---
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクト設定 & 背景ON/OFF切り替え ---
    let effectPowerLevel = 2; // 1: Low, 2: Mid, 3: High
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    function toggleBackground() {
      bgEnabled = !bgEnabled;
      document.getElementById('bg-btn').textContent = bgEnabled ? 'BG: ON' : 'BG: OFF';
    }

    // =============================================================
    // ★ 軽量化・厳選されたラグジュアリー演出
    // =============================================================
    const luxuryColors = ['#FFF8DC', '#FFE4B5', '#FFD700', '#FFFFFF'];

    // 1. 星パーティクル（20個に削減してクリーンで軽い動作に）
    const starParticles = [];
    for (let i = 0; i < 20; i++) {
      starParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 7 + 2.5,
        speedY: Math.random() * 0.4 + 0.15,
        opacity: Math.random() * 0.5 + 0.3,
        color: luxuryColors[Math.floor(Math.random() * luxuryColors.length)],
        onFace: false
      });
    }

    // 2. 流れ星（最大1本に制限）
    const shootingStars = [];
    function createShootingStar() {
      return {
        x: Math.random() * window.innerWidth * 0.7 + window.innerWidth * 0.15,
        y: Math.random() * (window.innerHeight * 0.25),
        length: 120,
        speed: 12,
        width: 1.5,
        angle: Math.PI / 4,
        opacity: 1,
        life: 0,
        maxLife: 20,
        color: '#FFE4B5'
      };
    }

    // 3. ミニマルなボケ（4個に削減）
    const bokehs = [];
    for (let i = 0; i < 4; i++) {
      bokehs.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 25 + 10,
        color: luxuryColors[i % luxuryColors.length],
        alpha: 0.06
      });
    }

    let timeCount = 0;

    // 描画：クロス星
    function drawFastStar(ctx, x, y, size, color, opacity, onFace) {
      ctx.globalAlpha = onFace ? opacity * 0.15 : opacity;
      ctx.fillStyle = color;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 0.8;

      ctx.beginPath();
      ctx.moveTo(x - size, y); ctx.lineTo(x + size, y);
      ctx.moveTo(x, y - size); ctx.lineTo(x, y + size);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, size * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 描画：流れ星
    function drawFastShootingStar(ctx, star) {
      ctx.globalAlpha = star.opacity;
      const tailX = star.x - Math.cos(star.angle) * star.length;
      const tailY = star.y - Math.sin(star.angle) * star.length;

      const grad = ctx.createLinearGradient(star.x, star.y, tailX, tailY);
      grad.addColorStop(0, '#FFFFFF');
      grad.addColorStop(0.4, star.color);
      grad.addColorStop(1, 'transparent');

      ctx.strokeStyle = grad;
      ctx.lineWidth = star.width;
      ctx.beginPath();
      ctx.moveTo(star.x, star.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
    }

    // 描画：背景夜景AR（bgEnabledがtrueの場合のみ描画）
    function drawFastNightCity(ctx, width, height) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, 'rgba(5, 8, 20, 0.45)');
      skyGrad.addColorStop(1, 'rgba(25, 18, 25, 0.5)');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      bokehs.forEach((b, i) => {
        const pulse = Math.sin(timeCount * 1.5 + i) * 0.02;
        ctx.globalAlpha = b.alpha + pulse;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      frameCounter++;

      if (frameCounter % 10 === 0) {
        triggerFaceDetect();
      }

      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // 背景夜景ON/OFF制御
      if (bgEnabled) {
        drawFastNightCity(ctx, logicalWidth, logicalHeight);
      }

      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.0);

      // 流れ星の生成・描画
      if (Math.random() < 0.012 * activeCount && shootingStars.length < 1) {
        shootingStars.push(createShootingStar());
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const star = shootingStars[i];
        star.x += Math.cos(star.angle) * star.speed;
        star.y += Math.sin(star.angle) * star.speed;
        star.life++;

        if (star.life > star.maxLife - 6) {
          star.opacity -= 0.15;
        }

        if (star.life >= star.maxLife || star.opacity <= 0) {
          shootingStars.splice(i, 1);
        } else {
          drawFastShootingStar(ctx, star);
        }
      }

      // 星パーティクルの描画 ＆ 顔認識回避
      starParticles.forEach((p) => {
        p.y += p.speedY * activeCount;
        const opacity = 0.35 + Math.sin(timeCount * 1.8 + p.x) * 0.3;

        if (p.y > logicalHeight + 10) {
          p.y = -10;
          p.x = Math.random() * logicalWidth;
        }

        p.onFace = false;
        if (faces.length > 0) {
          for (let i = 0; i < faces.length; i++) {
            const { x, y, width, height } = faces[i].box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        if (effectPowerLevel > 0) {
          drawFastStar(ctx, p.x, p.y, p.size, p.color, opacity, p.onFace);
        }
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG自動保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.92);
      const link = document.createElement('a');
      link.download = 'luxury_camera_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED";
      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 2500);
    });

    initCamera();
  </script>
</body>
</html>
