<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Night City & Shooting Stars HD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.85);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み (人物認識用) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    LUXURY NIGHT AR MODE: <span id="status">MODEL LOADING...</span> | JPG保存 | 流れ星 & 夜景AR
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = [];

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識 (Face-api.js) の実装 ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);

      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズームの実装 ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- Canvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクト強弱設定 ---
    let effectPowerLevel = 2; // 1: Low, 2: Mid, 3: High
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    // =============================================================
    // ★ ラグジュアリー星 & 流れ星 & 夜景 AR システム
    // =============================================================
    const luxuryColors = ['#FFF8DC', '#FFE4B5', '#FFD700', '#F0E68C', '#FFFFFF', '#E6E6FA', '#FFDF00'];
    
    // 1. 星パーティクル
    const starParticles = [];
    for (let i = 0; i < 90; i++) {
      starParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 12 + 4,
        speedY: Math.random() * 0.8 + 0.2,
        speedX: (Math.random() - 0.5) * 0.6,
        opacity: Math.random() * 0.7 + 0.3,
        color: luxuryColors[Math.floor(Math.random() * luxuryColors.length)],
        twinkleSpeed: Math.random() * 0.05 + 0.02,
        rotation: Math.random() * Math.PI,
        points: Math.random() > 0.4 ? 4 : 5, // 4角星か5角星
        onFace: false
      });
    }

    // 2. ラグジュアリー流れ星（サイズの異なるShooting Stars）
    const shootingStars = [];
    function createShootingStar() {
      const isLarge = Math.random() > 0.65;
      const sizeType = isLarge ? 'LARGE' : (Math.random() > 0.5 ? 'MEDIUM' : 'SMALL');
      
      let length, speed, width;
      if (sizeType === 'LARGE') {
        length = Math.random() * 250 + 200;
        speed = Math.random() * 12 + 15;
        width = Math.random() * 3 + 2.5;
      } else if (sizeType === 'MEDIUM') {
        length = Math.random() * 150 + 100;
        speed = Math.random() * 10 + 10;
        width = Math.random() * 2 + 1.5;
      } else {
        length = Math.random() * 80 + 50;
        speed = Math.random() * 8 + 8;
        width = Math.random() * 1.2 + 0.8;
      }

      const angle = Math.PI / 4 + (Math.random() - 0.5) * 0.2; // 斜め45度前後

      return {
        x: Math.random() * window.innerWidth * 1.2 - window.innerWidth * 0.2,
        y: Math.random() * (window.innerHeight * 0.5) - 100,
        length: length,
        speed: speed,
        width: width,
        angle: angle,
        opacity: 1,
        life: 0,
        maxLife: Math.random() * 40 + 30,
        color: luxuryColors[Math.floor(Math.random() * luxuryColors.length)]
      };
    }

    // 3. 変化するボケ（Luxury Bokeh Lights）
    const bokehs = [];
    for (let i = 0; i < 25; i++) {
      bokehs.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 35 + 15,
        color: luxuryColors[Math.floor(Math.random() * luxuryColors.length)],
        alpha: Math.random() * 0.15 + 0.05,
        pulseSpeed: Math.random() * 0.02 + 0.005,
        driftX: (Math.random() - 0.5) * 0.3,
        driftY: (Math.random() - 0.5) * 0.3
      });
    }

    let timeCount = 0;

    // 星の描画関数（クロス輝き星 / 4角・5角）
    function drawLuxuryStar(ctx, x, y, size, color, opacity, rotation, points, onFace) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      if (onFace) {
        ctx.globalAlpha = opacity * 0.15;
      } else {
        ctx.globalAlpha = opacity;
      }

      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = size * 1.5;

      // 輝くクロス＆ポリゴン描画
      ctx.beginPath();
      const outerRadius = size;
      const innerRadius = size * 0.35;
      for (let i = 0; i < points * 2; i++) {
        const r = (i % 2 === 0) ? outerRadius : innerRadius;
        const currAngle = (i * Math.PI) / points;
        const px = Math.cos(currAngle) * r;
        const py = Math.sin(currAngle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // 中央の強いダイヤモンド輝き線
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-size * 1.2, 0); ctx.lineTo(size * 1.2, 0);
      ctx.moveTo(0, -size * 1.2); ctx.lineTo(0, size * 1.2);
      ctx.stroke();

      ctx.restore();
    }

    // 流れ星の描画関数
    function drawShootingStar(ctx, star) {
      ctx.save();
      ctx.globalAlpha = star.opacity;

      const tailX = star.x - Math.cos(star.angle) * star.length;
      const tailY = star.y - Math.sin(star.angle) * star.length;

      const grad = ctx.createLinearGradient(star.x, star.y, tailX, tailY);
      grad.addColorStop(0, '#FFFFFF');
      grad.addColorStop(0.2, star.color);
      grad.addColorStop(1, 'transparent');

      ctx.strokeStyle = grad;
      ctx.lineWidth = star.width;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(star.x, star.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      // 先端のラグジュアリー輝きヘッド
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = star.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.width * 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // リアルタイムラグジュアリー夜景ARを描画
    function drawNightCityAR(ctx, width, height) {
      // 1. ラグジュアリーグラデーション（深みのある夜空）
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, 'rgba(5, 8, 22, 0.45)');
      skyGrad.addColorStop(0.5, 'rgba(20, 15, 35, 0.35)');
      skyGrad.addColorStop(1, 'rgba(40, 25, 20, 0.5)');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. 変化するビル群のシルエット（地平線の煌びやかな夜景）
      const cityY = height * 0.72;
      ctx.save();
      ctx.fillStyle = 'rgba(8, 10, 20, 0.55)';
      
      const buildingWidths = [40, 60, 35, 80, 50, 70, 45, 90, 65];
      let currentX = 0;
      let idx = 0;
      while (currentX < width) {
        const bWidth = buildingWidths[idx % buildingWidths.length];
        const bHeight = 80 + Math.sin(idx * 1.5 + timeCount * 0.2) * 20 + ((idx * 37) % 90);
        ctx.fillRect(currentX, cityY - bHeight, bWidth, bHeight + (height - cityY));

        // ビルの窓の光（ちらつき変化）
        ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
        for (let wy = cityY - bHeight + 10; wy < cityY - 10; wy += 15) {
          for (let wx = currentX + 8; wx < currentX + bWidth - 8; wx += 12) {
            if (Math.sin(wx * wy + timeCount * 2) > 0.1) {
              ctx.fillRect(wx, wy, 4, 6);
            }
          }
        }
        ctx.fillStyle = 'rgba(8, 10, 20, 0.55)';
        currentX += bWidth + 4;
        idx++;
      }
      ctx.restore();

      // 3. ボケ（ゆらめく光の粒）の更新と描画
      bokehs.forEach(b => {
        b.x += b.driftX;
        b.y += b.driftY;
        if (b.x < 0) b.x = width; if (b.x > width) b.x = 0;
        if (b.y < 0) b.y = height; if (b.y > height) b.y = 0;

        const currentAlpha = b.alpha + Math.sin(timeCount * 5 + b.x) * 0.05;
        ctx.save();
        ctx.globalAlpha = Math.max(0.01, currentAlpha);
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      // 1. ラグジュアリー夜景背景ARを描画
      drawNightCityAR(ctx, logicalWidth, logicalHeight);

      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.8 : 1.3);

      // 2. 流れ星（Shooting Stars）の生成・更新・描画
      if (Math.random() < 0.04 * activeCount && shootingStars.length < 5) {
        shootingStars.push(createShootingStar());
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const star = shootingStars[i];
        star.x += Math.cos(star.angle) * star.speed;
        star.y += Math.sin(star.angle) * star.speed;
        star.life++;

        if (star.life > star.maxLife - 10) {
          star.opacity -= 0.1;
        }

        if (star.life >= star.maxLife || star.opacity <= 0) {
          shootingStars.splice(i, 1);
        } else {
          drawShootingStar(ctx, star);
        }
      }

      // 3. 舞い散る煌びやかな星（Stars）の描写＆顔認識回避
      starParticles.forEach((p) => {
        p.y += p.speedY * activeCount;
        p.x += p.speedX * activeCount;
        p.rotation += p.twinkleSpeed;
        p.opacity = 0.4 + Math.sin(timeCount * 3 + p.x) * 0.4;

        // 画面外リセット
        if (p.y > logicalHeight + 20 || p.x < -20 || p.x > logicalWidth + 20) {
          p.y = -20;
          p.x = Math.random() * logicalWidth;
          p.color = luxuryColors[Math.floor(Math.random() * luxuryColors.length)];
        }

        // 顔認識回避ロジック
        p.onFace = false;
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        if (effectPowerLevel > 0) {
          drawLuxuryStar(ctx, p.x, p.y, p.size, p.color, p.opacity, p.rotation, p.points, p.onFace);
        }
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（JPG自動保存 & ライブラリ保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像（ズーム状態を反映）
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. ラグジュアリー夜景 ＆ 流れ星 ＆ 星ARエフェクトを重ねて合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPGで保存
      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.95);
      const link = document.createElement('a');
      link.download = 'luxury_night_star_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED (Check Library)";

      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 3000);
    });

    // 初期化
    initCamera();
  </script>
</body>
</html>
